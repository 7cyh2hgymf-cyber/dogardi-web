<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#173C35">
  <title>Sitter link · Dogardi</title>
  <link rel="icon" href="mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sitter.css">
  <script src="sitter.js" defer></script>
</head>
<body>
  <!-- The same Forest header band as the app's Home (filled in by sitter.js). -->
  <header class="band" id="band">
    <div class="band-row">
      <div class="band-text">
        <p class="eyebrow">Dogardi · no app needed</p>
        <h1 class="band-title">Sitter link</h1>
      </div>
    </div>
  </header>

  <main id="page" aria-busy="true">
    <p class="muted center">Loading…</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer" id="footer" hidden>
    <div class="inner">
      <a class="btn outline block" id="call-owner">Call</a>
      <button class="emergency block" data-emergency>Emergency</button>
    </div>
  </footer>
</body>
</html>
